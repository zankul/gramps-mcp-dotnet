# Local dev stack: this server + a local Gramps Web instance, for exercising write tools.
# Never point GRAMPS_ALLOW_WRITES=true at anything but this local grampsweb container.
#
# Set GRAMPS_API_URL=http://grampsweb:5000, GRAMPS_USERNAME=owner, GRAMPS_PASSWORD=owner,
# GRAMPS_ALLOW_WRITES=true in .env.dev (gitignored). Browse the tree directly at
# http://localhost:8090.
#
# `docker compose -f docker-compose.dev.yml up` is enough on its own — startup is staged across
# three services:
#
#   grampsweb_bootstrap -> grampsweb_celery -> grampsweb_init -> gramps-mcp
#
# grampsweb_bootstrap waits for grampsweb's HTTP server, then creates the owner account, then
# exits 0. That's also what triggers the tree's initial SQLite schema creation; running it here,
# alone, single-threaded, before celery or gramps-mcp exist, is what avoids a race where both
# grampsweb and grampsweb_celery try to create that schema concurrently on a cold start and
# corrupt it ("sqlite3.OperationalError: table person already exists"). grampsweb_celery waits for
# grampsweb_bootstrap to *complete successfully* (not merely start) before it starts, so the
# worker never touches the tree until the schema exists.
#
# grampsweb_init depends on grampsweb_celery and only handles the optional example-dataset seed
# (see below) before reporting healthy — it is deliberately *not* what gates schema creation, so
# it no longer needs to be on the critical path for the plain (unseeded) case. gramps-mcp is the
# only service that waits on grampsweb_init.
#
# Why the split: an earlier version had a single grampsweb_init doing bootstrap *and* seeding,
# with grampsweb_celery gated on grampsweb_init being healthy. That meant the worker that
# performs the example-dataset import couldn't start until init was healthy — but init's own
# healthcheck was waiting on the import finishing. On a cold seeded start that's a deadlock init
# could only escape by timing out (burning its full poll budget and printing "Timed out waiting
# for example dataset import to finish" on every run, without the import ever having a chance to
# progress). Splitting bootstrap out breaks that cycle: celery is released as soon as the schema
# exists, well before grampsweb_init ever queues an import.
#
# Trade-off: grampsweb_bootstrap is a genuine one-shot (`restart: "no"`) and shows as "exited" in
# tools like Portainer that don't distinguish an intentional one-shot exit from a crash — the
# previous design kept init alive with `sleep infinity` specifically to avoid that. We accept the
# cosmetic "exited" status in exchange for actually removing the deadlock; don't reintroduce the
# coupling between celery's startup and init's healthcheck to chase the cosmetic fix back away.
#
# grampsweb_init's sentinel (/run/init-done) lives on its own container's ephemeral filesystem,
# not a shared volume — if it persisted across restarts, a later redeploy that pulls a grampsweb
# image with *new* migrations could report healthy instantly from a stale sentinel and release
# gramps-mcp before grampsweb finishes applying those new migrations, reintroducing the exact kind
# of race grampsweb_bootstrap exists to prevent. Keeping it ephemeral forces a fresh wait on every
# container start, which is cheap (a few seconds, or a few minutes for a fresh seeded import) when
# there's nothing new to do.
#
# Set GRAMPS_SEED_EXAMPLE_DATA=true to have grampsweb_init also import the example.gramps
# dataset that ships inside the grampsweb image itself (2000+ people, families, events —
# useful for exercising gramps_search/gramps_relation/gramps_timeline against something
# realistic instead of an empty tree). Only imports into a genuinely empty tree: a tree that
# already has *some* people but fewer than expected, with no import tracked, is treated as your
# own pre-existing data (a small GEDCOM, someone added through the UI) rather than a partial
# example import, and is left alone instead of merged into. See grampsweb_init below for the
# full decision logic.
#
# Gotcha: `$VARIABLE` inside a compose `command:` block is interpolated by Docker Compose at
# *parse* time, from the host's environment — not by the container's shell at run time. The one
# use of that form below (`$GRAMPS_SEED_EXAMPLE_DATA` in grampsweb_init's `if`) relies on it being
# sourced the same way as the `environment:` block's `${GRAMPS_SEED_EXAMPLE_DATA:-false}` (host
# shell / top-level `.env`, not `.env.dev`) so both resolve to the same value. Anything meant to
# be evaluated by /bin/sh or python *inside* the container instead must be escaped as `$$`.

services:
  gramps-mcp:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      grampsweb_init:
        condition: service_healthy

  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    ports:
      - "8090:5000"  # browse the tree directly at http://localhost:8090
    environment:
      GRAMPSWEB_TREE: "Gramps MCP Dev Tree"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
      GRAMPS_SEED_EXAMPLE_DATA: ${GRAMPS_SEED_EXAMPLE_DATA:-false}
      # How many people the bundled example.gramps import must reach before grampsweb_init calls
      # it done - see that service's script. Override if a future grampsweb image ships a
      # differently-sized dataset.
      GRAMPS_SEED_PEOPLE_FLOOR: ${GRAMPS_SEED_PEOPLE_FLOOR:-2000}
    depends_on:
      - grampsweb_redis
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp

  # One-shot: waits for grampsweb to accept connections, then creates the owner account (safe to
  # re-run: "user already exists" is swallowed), then exits 0. This is what performs the tree's
  # initial SQLite schema creation, single-threaded, before any other service that touches the
  # database exists — see the top-of-file comment for the concurrent-migration race this avoids.
  # `restart: "no"` and no healthcheck: grampsweb_celery gates on this *completing successfully*,
  # not on a sentinel, so there's nothing to keep alive for. Shows as "exited" in tools like
  # Portainer — see top-of-file comment for why that's an accepted trade-off here.
  grampsweb_bootstrap:
    <<: *grampsweb
    restart: "no"
    ports: []
    depends_on:
      - grampsweb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # / serves the frontend and needs no auth, unlike /api/metadata/ (401 without a token) —
        # just need confirmation the HTTP server is up; alembic migrations already ran by then.
        until python3 -c "import urllib.request; urllib.request.urlopen('http://grampsweb:5000/')" 2>/dev/null; do
          sleep 1
        done
        export GRAMPSWEB_SECRET_KEY=$(cat /app/secret/secret)
        cd /app/src
        python3 -m gramps_webapi --config /app/config/config.cfg user add \
          --fullname Owner --role 4 owner owner || true

  # Waits for the schema-creating grampsweb_bootstrap to finish, then does the optional
  # example-dataset seed, then reports healthy via a sentinel file. Stays running (sleep infinity)
  # rather than exiting for the same "exited" vs. "healthy" reason as the old single-service init
  # had — see top-of-file comment. By the time this runs, grampsweb_celery has already started
  # (grampsweb is up, the owner account and schema already exist), so the import this queues can
  # actually be picked up and processed instead of piling up behind a service that can't start yet.
  grampsweb_init:
    <<: *grampsweb
    restart: unless-stopped
    ports: []
    depends_on:
      - grampsweb_celery
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ "$GRAMPS_SEED_EXAMPLE_DATA" = "true" ]; then
          # Best-effort: a transient failure here must not block /run/init-done, since
          # seeding is opt-in and the tree is otherwise perfectly usable empty. The import
          # itself runs async via Celery, so object_counts.people alone can't tell "not
          # started" apart from "queued, not finished yet" - polling that count on its own
          # would let a grampsweb_init restart mid-import see people == 0 and queue a
          # second, duplicate import. QUEUED_MARKER lives on the gramps_cache volume (unlike
          # the /run/init-done sentinel, which is intentionally ephemeral - see the comment
          # above) specifically so it survives a restart: it's written *before* the POST
          # that queues the import, so a restart that finds it just waits for the
          # already-queued import to finish instead of re-queuing one.
          python3 <<'PYEOF' || echo "Example dataset seeding failed - continuing without it."
        import json
        import os
        import time
        import urllib.request

        QUEUED_MARKER = "/app/cache/.example_seed_queued"
        # The Gramps XML import commits different object classes (people, families, notes,
        # citations, ...) at different points in the transaction, so `people` alone can plateau
        # early while other classes are still landing - and checking `people > 0` on its own trips
        # on the very first record committed, near the *start* of a 2000+ person import. Sum every
        # object_counts value instead for a monotone progress signal, and require the total to
        # hold steady for a stability window - with people past a floor, so an early near-empty
        # plateau can't pass - before calling the import done.
        STABILITY_WINDOW_S = 20
        POLL_INTERVAL_S = 3
        # Measured cold import of the full example.gramps dataset (2157 people, 10536 objects)
        # completes in ~10-16s, for a total wait (including the stability window above) of
        # ~35-51s end to end - see docs/testing.md. 180s leaves >3x that margin while still
        # failing fast if something is genuinely stuck, instead of the 900s this was originally
        # set to (an estimate that turned out to be an order of magnitude too pessimistic, and
        # which - combined with the QUEUED_MARKER poisoning bug fixed below - could previously
        # cost 15 minutes on every single start once the marker was stuck).
        OVERALL_TIMEOUT_S = 180
        # grampsweb:latest is unpinned, so a future image could ship a smaller example.gramps.
        # The floor stays a genuine completion gate rather than a soft warning - quiescence alone
        # can't tell "finished" from "a worker died mid-import and the count will never move
        # again", which is exactly the failure mode the floor exists to catch (see requirement in
        # the code review this fixed: a partially-seeded tree must never be reported as done).
        # What was wrong before was hard-coding today's dataset size with no escape hatch; make
        # it overridable via GRAMPS_SEED_PEOPLE_FLOOR instead, so a future dataset resize needs an
        # environment variable change, not a code change.
        PEOPLE_FLOOR = int(os.environ.get("GRAMPS_SEED_PEOPLE_FLOOR", "2000"))

        def api(method, path, token=None, data=None, content_type=None):
            headers = {}
            if token:
                headers["Authorization"] = f"Bearer {token}"
            if content_type:
                headers["Content-Type"] = content_type
            req = urllib.request.Request(
                f"http://grampsweb:5000{path}", data=data, headers=headers, method=method
            )
            # Python's default socket timeout is None (block forever). Without this, a hung
            # gunicorn worker under import load - the heaviest thing this stack does - would wedge
            # a single urlopen call indefinitely, and neither get_token_with_retry's 120s bound
            # nor OVERALL_TIMEOUT_S below would ever fire, since both are checked *between* calls,
            # not while one is blocked.
            with urllib.request.urlopen(req, timeout=30) as resp:
                body = resp.read()
                return json.loads(body) if body else None

        def get_token():
            return api(
                "POST",
                "/api/token/",
                data=json.dumps({"username": "owner", "password": "owner"}).encode(),
                content_type="application/json",
            )["access_token"]

        def get_token_with_retry(timeout_s=120, poll_s=1):
            # Docker's restart policies don't honour depends_on: after a host reboot or Docker
            # daemon restart, this container (restart: unless-stopped) can come up concurrently
            # with grampsweb, which lost the ordering grampsweb_bootstrap gave it during the
            # original `up`. Retrying here instead of failing on the first connection-refused
            # means a concurrent restart waits for grampsweb instead of swallowing the error and
            # reporting healthy on a tree that was never seeded.
            start = time.monotonic()
            last_exc = None
            while time.monotonic() - start <= timeout_s:
                try:
                    return get_token()
                except Exception as exc:
                    last_exc = exc
                    time.sleep(poll_s)
            raise RuntimeError(
                f"Could not reach grampsweb / authenticate within {timeout_s}s"
            ) from last_exc

        def object_counts(token):
            return api("GET", "/api/metadata/", token=token)["object_counts"]

        def wait_for_import(token):
            # Blocks until quiescent past PEOPLE_FLOOR or OVERALL_TIMEOUT_S elapses. Returns
            # (done, people). Tolerates transient polling errors (a 502/503 under import load, an
            # expired token) by retrying next iteration instead of abandoning the wait on the
            # first blip - a genuine outage still bottoms out via OVERALL_TIMEOUT_S, it just does
            # so by giving up rather than crashing out early on a single flaky poll.
            start = time.monotonic()
            last_total = None
            last_change = start
            seen_people = []
            people = 0
            saw_successful_poll = False
            while True:
                if time.monotonic() - start > OVERALL_TIMEOUT_S:
                    print("Timed out waiting for example dataset import to become quiescent.")
                    print("people progression:", " -> ".join(str(p) for p in seen_people))
                    # Below the floor, the import is almost certainly dead (a live one would
                    # still be moving) - remove the marker so the next start re-queues instead of
                    # waiting out the full timeout again forever. At/above the floor but not yet
                    # confirmed stable, leave the marker: that's very likely still a legitimate,
                    # if slow, import, and re-queuing a second one on top of it would be worse.
                    # Gated on saw_successful_poll, not just `people < PEOPLE_FLOOR`: `people`
                    # defaults to 0 and is only ever updated on a *successful* poll below - if
                    # every single poll in this window raised (grampsweb restarting, a sustained
                    # 502), that 0 is a default we never actually observed, not a real reading,
                    # and removing the marker on it would let the next start queue a *second*
                    # import on top of one that, for all we actually learned, might still be
                    # running fine.
                    if saw_successful_poll and people < PEOPLE_FLOOR and os.path.exists(QUEUED_MARKER):
                        os.remove(QUEUED_MARKER)
                    return False, people
                try:
                    counts = object_counts(token)
                except Exception as exc:
                    print(f"Transient error polling /api/metadata/ ({exc!r}) - retrying.")
                    try:
                        token = get_token()
                    except Exception:
                        pass
                    time.sleep(POLL_INTERVAL_S)
                    continue
                saw_successful_poll = True
                total = sum(counts.values())
                people = counts.get("people", 0)
                if not seen_people or seen_people[-1] != people:
                    seen_people.append(people)
                    print(f"people: {' -> '.join(str(p) for p in seen_people)} (total objects: {total})")
                if total == last_total:
                    stable_for = time.monotonic() - last_change
                    if stable_for >= STABILITY_WINDOW_S and people >= PEOPLE_FLOOR:
                        print(
                            f"Example dataset import complete: {people} people, {total} total "
                            f"objects, stable for {stable_for:.0f}s."
                        )
                        if os.path.exists(QUEUED_MARKER):
                            os.remove(QUEUED_MARKER)
                        return True, people
                else:
                    last_total = total
                    last_change = time.monotonic()
                time.sleep(POLL_INTERVAL_S)

        token = get_token_with_retry()
        people = object_counts(token).get("people", 0)
        marker_exists = os.path.exists(QUEUED_MARKER)

        # Order matters, and there are four states to tell apart:
        #   1. no marker, people >= PEOPLE_FLOOR    -> already fully seeded, nothing to do.
        #   2. no marker, people == 0               -> genuinely empty, safe to queue.
        #   3. no marker, 0 < people < PEOPLE_FLOOR  -> NOT ours to touch (see below).
        #   4. marker present (any people count)    -> an import is tracked in flight - confirm
        #      via wait_for_import rather than guessing from a single reading.
        # `people > 0` alone (the original bug here) collapses states 1 and 3 into "skip", which
        # trips on the very first record committed in state 4 and reports healthy on a
        # half-imported tree. The other tempting fix - re-queuing in state 3 - is also wrong: a
        # nonzero, sub-floor, unmarked count is indistinguishable from a developer's own small
        # GEDCOM, or a person added through the UI, from object_counts alone. Re-queuing would
        # merge the example dataset into someone's real tree, which is worse than the deadlock
        # this file exists to avoid. State 3 is also more reachable here than it looks: it needs
        # no failed import at all, just a persistent dev tree with 1-1999 people and seeding
        # turned on.
        #
        # In practice, state 3 looks to be unreachable *through this script's own import path*:
        # this version of Gramps Web's import commits atomically as observed via the API (checked
        # directly - object_counts jumps straight from all-zero to the final count, never a
        # gradual climb), so an import that dies mid-transaction leaves no trace, not a partial
        # count. State 3 is only reachable by the tree gaining people some *other* way - which is
        # exactly the case the dev branch below exists to protect.
        if not marker_exists and people >= PEOPLE_FLOOR:
            print(f"Tree already has {people} people (no import in flight) - skipping example dataset import.")
        elif not marker_exists and people == 0:
            # Marker must be written before the POST (that ordering is what lets a restart
            # between "queued" and "finished" wait instead of re-queuing), but if the file read
            # or the POST itself then fails, the marker must not survive: it lives on the
            # persistent gramps_cache volume, so a stuck marker would otherwise poison every
            # future start into waiting out OVERALL_TIMEOUT_S for an import that was never
            # actually queued, with no way out short of manually deleting the volume.
            with open(QUEUED_MARKER, "w") as f:
                f.write("queued")
            try:
                with open("/venv/share/doc/gramps/example/gramps/example.gramps", "rb") as f:
                    payload = f.read()
                api(
                    "POST",
                    "/api/importers/gramps/file",
                    token=token,
                    data=payload,
                    content_type="application/octet-stream",
                )
            except Exception:
                os.remove(QUEUED_MARKER)
                raise
            print("Queued import of bundled example.gramps dataset (async, via Celery) - waiting for it to finish.")
            wait_for_import(token)
        elif not marker_exists:
            # State 3: seeding is opt-in and best-effort, and this tree already has data that
            # isn't ours - treat it as the developer's own and leave it alone rather than
            # importing on top of it or blocking on a wait that could never resolve either way.
            print(
                f"WARNING: tree has {people} people, below the {PEOPLE_FLOOR}-person floor, and "
                "no import is tracked - assuming this is your own pre-existing data and skipping "
                "the example dataset import rather than merging into it. Start from an empty "
                "tree (delete the gramps_* volumes) to seed cleanly."
            )
        else:
            print(f"Example dataset import already queued by a previous run (marker: {QUEUED_MARKER}) - waiting for it to finish.")
            wait_for_import(token)
        PYEOF
        fi

        touch /run/init-done
        sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/run/init-done"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      # 450s: get_token_with_retry's bound (120s, only paid on the reboot-race path - see the
      # script) + OVERALL_TIMEOUT_S (180s) + margin, when seeding is on.
      retries: 90

  grampsweb_celery:
    <<: *grampsweb
    ports: []
    depends_on:
      grampsweb_bootstrap:
        condition: service_completed_successfully
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped

volumes:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:
