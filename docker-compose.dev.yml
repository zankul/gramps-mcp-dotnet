# Local dev stack: this server + a local Gramps Web instance, for exercising write tools.
# Never point GRAMPS_ALLOW_WRITES=true at anything but this local grampsweb container.
#
# Set GRAMPS_API_URL=http://grampsweb:5000, GRAMPS_USERNAME=owner, GRAMPS_PASSWORD=owner,
# GRAMPS_ALLOW_WRITES=true in .env.dev (gitignored). Browse the tree directly at
# http://localhost:8090.
#
# `docker compose -f docker-compose.dev.yml up` is enough on its own — startup is staged
# automatically via `grampsweb_init`: it waits for grampsweb's HTTP server, then creates the
# owner account. That command is also what triggers the tree's initial SQLite schema creation;
# running it here, alone, before celery or gramps-mcp exist, is what avoids a race where both
# grampsweb and grampsweb_celery try to create that schema concurrently on a cold start and
# corrupt it ("sqlite3.OperationalError: table person already exists"). grampsweb_celery and
# gramps-mcp wait for grampsweb_init to report healthy before starting.
#
# Set GRAMPS_SEED_EXAMPLE_DATA=true to have grampsweb_init also import the example.gramps
# dataset that ships inside the grampsweb image itself (2000+ people, families, events —
# useful for exercising gramps_search/gramps_relation/gramps_timeline against something
# realistic instead of an empty tree). Only happens once per empty tree: grampsweb_init checks
# the object counts first and skips the import if the tree already has people in it.

services:
  gramps-mcp:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      grampsweb_init:
        condition: service_healthy

  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    ports:
      - "8090:5000"  # browse the tree directly at http://localhost:8090
    environment:
      GRAMPSWEB_TREE: "Gramps MCP Dev Tree"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
      GRAMPS_SEED_EXAMPLE_DATA: ${GRAMPS_SEED_EXAMPLE_DATA:-false}
    depends_on:
      - grampsweb_redis
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp

  # Waits for grampsweb to accept connections, then creates the owner account. Safe to re-run on
  # restarts: "user already exists" is swallowed. Stays running (sleep infinity) rather than
  # exiting, and reports readiness via a healthcheck on a sentinel file instead of exit code —
  # keeps it a normal healthy service instead of showing as "exited"/failed in tools like
  # Portainer that don't distinguish an intentional one-shot exit from a crash. The sentinel
  # lives on this container's own ephemeral filesystem (/run), not a shared volume — if it
  # persisted across restarts, a later redeploy that pulls a grampsweb image with *new*
  # migrations could report healthy instantly from a stale sentinel and release grampsweb_celery
  # before grampsweb finishes applying those new migrations, reintroducing the exact race this
  # is meant to prevent. Keeping it ephemeral forces a fresh wait+bootstrap on every container
  # start, which is cheap (a few seconds) when there's nothing new to do.
  grampsweb_init:
    <<: *grampsweb
    restart: unless-stopped
    ports: []
    depends_on:
      - grampsweb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # / serves the frontend and needs no auth, unlike /api/metadata/ (401 without a token) —
        # just need confirmation the HTTP server is up; alembic migrations already ran by then.
        until python3 -c "import urllib.request; urllib.request.urlopen('http://grampsweb:5000/')" 2>/dev/null; do
          sleep 1
        done
        export GRAMPSWEB_SECRET_KEY=$(cat /app/secret/secret)
        cd /app/src
        python3 -m gramps_webapi --config /app/config/config.cfg user add \
          --fullname Owner --role 4 owner owner || true

        if [ "$GRAMPS_SEED_EXAMPLE_DATA" = "true" ]; then
          python3 <<'PYEOF'
        import json
        import urllib.request

        def api(method, path, token=None, data=None, content_type=None):
            headers = {}
            if token:
                headers["Authorization"] = f"Bearer {token}"
            if content_type:
                headers["Content-Type"] = content_type
            req = urllib.request.Request(
                f"http://grampsweb:5000{path}", data=data, headers=headers, method=method
            )
            with urllib.request.urlopen(req) as resp:
                body = resp.read()
                return json.loads(body) if body else None

        token = api(
            "POST",
            "/api/token/",
            data=json.dumps({"username": "owner", "password": "owner"}).encode(),
            content_type="application/json",
        )["access_token"]

        people = api("GET", "/api/metadata/", token=token)["object_counts"]["people"]
        if people == 0:
            with open("/venv/share/doc/gramps/example/gramps/example.gramps", "rb") as f:
                payload = f.read()
            api(
                "POST",
                "/api/importers/gramps/file",
                token=token,
                data=payload,
                content_type="application/octet-stream",
            )
            print("Queued import of bundled example.gramps dataset (async, via Celery).")
        else:
            print(f"Tree already has {people} people - skipping example dataset import.")
        PYEOF
        fi

        touch /run/init-done
        sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/run/init-done"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 60

  grampsweb_celery:
    <<: *grampsweb
    ports: []
    depends_on:
      grampsweb_init:
        condition: service_healthy
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped

volumes:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:
