# Disposable live-test stack: this server + a local Gramps Web instance, seeded with the bundled
# example.gramps dataset (~2157 people), for the automated live test tier (tests land in a later
# PR; see docs/testing.md). Every run is a guaranteed cold start — see the volumes note below — so
# the `object_counts.people == 0` seeding guard can never be silently skipped by a leftover tree.
#
# Bring it up and wait for the seed to finish:
#   docker compose -f docker-compose.test.yml -p gramps-test up -d --wait
# `--wait` blocks until grampsweb_init reports healthy, and that healthcheck doesn't go green
# until the example dataset has *finished* importing (see grampsweb_init below), not merely been
# queued. So once `up --wait` returns, the tree is fully seeded and ready to query — no test-side
# polling needed.
#
# Tear down with --volumes (`-v`) — see the volumes note below for why that's required here (and
# safe), unlike for docker-compose.dev.yml:
#   docker compose -f docker-compose.test.yml -p gramps-test down --volumes
#
# Ports (8091, 8081) deliberately don't collide with docker-compose.dev.yml (8090, 8080), so this
# stack can run alongside a dev stack without either interfering with the other.
#
# Volumes: docker-compose.dev.yml gives grampsweb's app state (SQLite db, users db, search index,
# secret key, media, cache) *named* volumes, so a local dev tree survives restarts. This stack
# does the opposite on purpose: `grampsweb` declares those same paths as anonymous volumes, and
# the other grampsweb-image services share them via `volumes_from` instead of a named-volume
# top-level section. Anonymous volumes aren't reused by name across separate `up` runs the way
# named ones are, but they do still linger as orphaned volumes after a plain `down` — pass
# `--volumes` to actually delete them and guarantee the next `up` starts cold. That's the reverse
# of the dev-stack advice ("never pass -v"): there is nothing here worth protecting.
#
# Staged startup mirrors docker-compose.dev.yml's fix for the concurrent-SQLite-schema-creation
# race ("table person already exists" — see that file's comments for the full story):
#
#   grampsweb_bootstrap -> grampsweb_celery -> grampsweb_init -> gramps-mcp
#
# grampsweb_bootstrap waits for grampsweb's HTTP server, creates the owner account alone (single-
# threaded schema creation), then exits 0. grampsweb_celery waits for that to *complete
# successfully* before starting, so the worker never races schema creation. grampsweb_init then
# queues the (here, unconditional — this stack only exists to be seeded) example.gramps import and
# *blocks* until that import is genuinely finished (polling /api/metadata/ until object_counts
# goes quiet, not merely non-zero) before touching its sentinel. Only gramps-mcp gates on
# grampsweb_init.
#
# Gotcha: `$VARIABLE` inside a compose `command:` block is interpolated by Docker Compose at
# *parse* time, from the host's environment — not by the container's shell at run time. Anything
# below that must be evaluated by /bin/sh or python inside the container has to avoid that bare
# `$NAME` form (escape as `$$` instead). This file has no such case: seeding here is unconditional
# so there's no env-gated `if` branch like the dev file's — but keep this in mind before adding one.

services:
  gramps-mcp:
    build: .
    ports:
      - "8081:8080"
    environment:
      GRAMPS_API_URL: http://grampsweb:5000
      GRAMPS_USERNAME: owner
      GRAMPS_PASSWORD: owner
      GRAMPS_ALLOW_WRITES: "true"
      MCP_TRANSPORT: http
    depends_on:
      grampsweb_init:
        condition: service_healthy

  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    ports:
      - "8091:5000"  # browse the seeded tree directly at http://localhost:8091
    environment:
      GRAMPSWEB_TREE: "Gramps MCP Test Tree"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      - grampsweb_redis
    volumes:
      - /app/users
      - /app/indexdir
      - /app/thumbnail_cache
      - /app/cache
      - /app/secret
      - /root/.gramps/grampsdb
      - /app/media
      - /tmp

  # One-shot: waits for grampsweb to accept connections, creates the owner account (safe to
  # re-run: "user already exists" is swallowed), then exits 0. This is what performs the tree's
  # initial SQLite schema creation, single-threaded, before grampsweb_celery exists — see the
  # top-of-file comment for the race this avoids. `restart: "no"` and no healthcheck:
  # grampsweb_celery gates on this *completing successfully*, not a sentinel.
  grampsweb_bootstrap:
    <<: *grampsweb
    restart: "no"
    ports: []
    volumes: []
    volumes_from:
      - grampsweb
    depends_on:
      - grampsweb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # / serves the frontend and needs no auth, unlike /api/metadata/ (401 without a token) —
        # just need confirmation the HTTP server is up; alembic migrations already ran by then.
        until python3 -c "import urllib.request; urllib.request.urlopen('http://grampsweb:5000/')" 2>/dev/null; do
          sleep 1
        done
        export GRAMPSWEB_SECRET_KEY=$(cat /app/secret/secret)
        cd /app/src
        python3 -m gramps_webapi --config /app/config/config.cfg user add \
          --fullname Owner --role 4 owner owner || true

  # Waits for the schema-creating grampsweb_bootstrap to finish, unconditionally queues the
  # bundled example.gramps import (guarded against re-queueing via QUEUED_MARKER, same as the dev
  # stack — see docker-compose.dev.yml's comment on that marker; it's orthogonal to this file's
  # staged-startup fix and preserved here too in case grampsweb_init itself restarts mid-import),
  # then *blocks* until the import is genuinely finished before reporting healthy. Unlike the dev
  # stack, failure here is not swallowed: this stack exists only to be seeded, so a seeding failure
  # or timeout must surface as an unhealthy service (`up --wait` failing), not a silently empty
  # tree that later live tests would misinterpret as "the API returned zero people".
  grampsweb_init:
    <<: *grampsweb
    restart: unless-stopped
    ports: []
    volumes: []
    volumes_from:
      - grampsweb
    depends_on:
      - grampsweb_celery
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        python3 <<'PYEOF'
        import json
        import os
        import time
        import urllib.request

        QUEUED_MARKER = "/app/cache/.example_seed_queued"
        # The Gramps XML import commits different object classes (people, families, notes,
        # citations, ...) at different points in the transaction, so `people` alone can plateau
        # early while other classes are still landing - and checking `people > 0` on its own trips
        # on the very first record committed, near the *start* of a 2157-person import. Sum every
        # object_counts value instead for a monotone progress signal, and require the total to
        # hold steady for a stability window - with people past a floor, so an early near-empty
        # plateau can't pass - before calling the import done.
        STABILITY_WINDOW_S = 20
        POLL_INTERVAL_S = 3
        # Measured cold import of the full example.gramps dataset (2157 people, 10536 objects)
        # completes in ~10-16s, for a total wait (including the stability window above) of
        # ~35-51s end to end - see docs/testing.md. 180s leaves >3x that margin while still
        # failing fast if something is genuinely stuck, instead of the 900s this was originally
        # set to (an estimate that turned out to be an order of magnitude too pessimistic).
        OVERALL_TIMEOUT_S = 180
        PEOPLE_FLOOR = 2000

        def api(method, path, token=None, data=None, content_type=None):
            headers = {}
            if token:
                headers["Authorization"] = f"Bearer {token}"
            if content_type:
                headers["Content-Type"] = content_type
            req = urllib.request.Request(
                f"http://grampsweb:5000{path}", data=data, headers=headers, method=method
            )
            with urllib.request.urlopen(req) as resp:
                body = resp.read()
                return json.loads(body) if body else None

        def get_token():
            return api(
                "POST",
                "/api/token/",
                data=json.dumps({"username": "owner", "password": "owner"}).encode(),
                content_type="application/json",
            )["access_token"]

        def object_counts(token):
            return api("GET", "/api/metadata/", token=token)["object_counts"]

        def wait_for_import(token):
            start = time.monotonic()
            last_total = None
            last_change = start
            seen_people = []
            while True:
                if time.monotonic() - start > OVERALL_TIMEOUT_S:
                    print("TIMEOUT waiting for the example.gramps import to become quiescent.")
                    print("people progression:", " -> ".join(str(p) for p in seen_people))
                    raise SystemExit(1)
                try:
                    counts = object_counts(token)
                except Exception:
                    # Access token may have expired mid-poll on a slow import; re-auth and retry.
                    token = get_token()
                    counts = object_counts(token)
                total = sum(counts.values())
                people = counts.get("people", 0)
                if not seen_people or seen_people[-1] != people:
                    seen_people.append(people)
                    print(f"people: {' -> '.join(str(p) for p in seen_people)} (total objects: {total})")
                if total == last_total:
                    stable_for = time.monotonic() - last_change
                    if stable_for >= STABILITY_WINDOW_S and people >= PEOPLE_FLOOR:
                        print(
                            f"Import quiescent: {people} people, {total} total objects, "
                            f"stable for {stable_for:.0f}s."
                        )
                        return
                else:
                    last_total = total
                    last_change = time.monotonic()
                time.sleep(POLL_INTERVAL_S)

        token = get_token()
        people = object_counts(token).get("people", 0)
        if people > 0:
            print(f"Tree already has {people} people - skipping example dataset import.")
        elif os.path.exists(QUEUED_MARKER):
            print(f"Example dataset import already queued by a previous run (marker: {QUEUED_MARKER}) - waiting for it to finish.")
            wait_for_import(token)
        else:
            # Marker must be written before the POST (that ordering is what lets a restart
            # between "queued" and "finished" wait instead of re-queuing - see docker-compose.dev
            # .yml's comment on this), but if the file read or the POST itself then fails, the
            # marker must not survive: even here, where the volume is anonymous and doesn't
            # outlive a `down`, a stuck marker would still poison every restart within the same
            # `up` session into waiting ~180s for an import that was never actually queued.
            with open(QUEUED_MARKER, "w") as f:
                f.write("queued")
            try:
                with open("/venv/share/doc/gramps/example/gramps/example.gramps", "rb") as f:
                    payload = f.read()
                api(
                    "POST",
                    "/api/importers/gramps/file",
                    token=token,
                    data=payload,
                    content_type="application/octet-stream",
                )
            except Exception:
                os.remove(QUEUED_MARKER)
                raise
            print("Queued import of bundled example.gramps dataset (async, via Celery) - waiting for it to finish.")
            wait_for_import(token)
        PYEOF

        touch /run/init-done
        sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/run/init-done"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 60  # 300s: HTTP boot (~10s) + OVERALL_TIMEOUT_S (180s) + margin

  grampsweb_celery:
    <<: *grampsweb
    ports: []
    volumes: []
    volumes_from:
      - grampsweb
    depends_on:
      grampsweb_bootstrap:
        condition: service_completed_successfully
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
