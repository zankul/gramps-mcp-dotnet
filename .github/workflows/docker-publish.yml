name: Docker Publish

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

jobs:
  publish:
    # Kill switch: set the repo/org variable DOCKER_PUBLISH_ENABLED to "false" to skip it
    # without touching this file, e.g.:
    #   gh variable set DOCKER_PUBLISH_ENABLED --body false --repo <owner>/<repo>
    # Defaults to enabled when the variable is unset.
    if: vars.DOCKER_PUBLISH_ENABLED != 'false'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # edge tracks the latest main commit; latest only moves on a vX.Y.Z release tag, so the
      # two channels stay independent of each other.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Local scan of the just-built image; no Docker Hub login needed for basic CVE analysis.
      # Only critical findings fail the job — this runs on every push, not just releases, so a
      # block-on-high threshold would be too disruptive against unpatched base-image CVEs.
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          exit-code: true
          only-severities: critical
