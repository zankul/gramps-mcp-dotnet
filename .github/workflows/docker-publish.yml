name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  publish:
    # Kill switch: set the repo/org variable DOCKER_PUBLISH_ENABLED to "false" to skip it
    # without touching this file, e.g.:
    #   gh variable set DOCKER_PUBLISH_ENABLED --body false --repo <owner>/<repo>
    # Defaults to enabled when the variable is unset.
    if: vars.DOCKER_PUBLISH_ENABLED != 'false'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # metadata-action's flavor=auto for "latest" compares this tag against sibling
          # semver tags to decide whether latest should move, which needs full tag history.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # edge tracks the latest main commit. "latest" uses metadata-action's default
      # flavor=auto, which only points it at the highest semver tag seen so far, so a
      # backport release on an older line can't drag it backward. No type=ref/branch tag here
      # on purpose — that accumulated as a permanent, ever-growing tag alongside edge.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Split the computed tags: the "staging" tag is pushed first and scanned; only if Scout
      # clears it do the mutable edge/semver/latest tags get promoted (via imagetools create)
      # to point at that same digest, so nothing pullable under a mutable tag skips the gate.
      #
      # "staging" is a fixed, reused name (not a unique sha-<short> per commit) deliberately:
      # imagetools create points promoted tags at the exact same digest as the staging push,
      # so GHCR represents them as one version with multiple tag names, not separate versions.
      # Deleting a version by tag name deletes *all* tags on it — a prior version of this
      # workflow used a unique sha-<short> staging tag and deleted-by-tag-name after
      # promotion, which took the just-promoted "edge" tag down with it since they shared a
      # version. Reusing one "staging" name means each new push just repoints it, leaving the
      # *previous* build's now-tagless version orphaned (not automatically deleted — see the
      # note at the bottom of this file for why), never the version currently backing
      # edge/latest/semver.
      - name: Split tags into staging vs promoted
        id: split
        run: |
          tags="${{ steps.meta.outputs.tags }}"
          staging=$(echo "$tags" | grep ':staging$' | head -n1)
          promoted=$(echo "$tags" | grep -v ':staging$' || true)
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          {
            echo "promoted<<TAGS_EOF"
            echo "$promoted"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (staging tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.split.outputs.staging }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scout's vulnerability database is gated behind Docker Hub auth even for local-image
      # scans — without it every job fails with "user githubactions not entitled to use Docker
      # Scout". Only critical findings fail the job — this runs on every push, not just
      # releases, so a block-on-high threshold would be too disruptive against unpatched
      # base-image CVEs. The staging tag above is already pushed, but no mutable tag
      # (edge/latest/semver) exists yet, so nothing "normal" is pullable until this passes.
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          command: cves
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          exit-code: true
          only-severities: critical

      - name: Promote scanned image to remaining tags
        if: steps.split.outputs.promoted != ''
        run: |
          digest="${{ steps.build.outputs.digest }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "ghcr.io/${{ github.repository }}@${digest}"
          done <<< "${{ steps.split.outputs.promoted }}"

      # No automated cleanup of orphaned "staging" versions here, deliberately. GHCR lists each
      # platform-specific manifest of a multi-arch image as its own version, untagged, referenced
      # only by digest from the tagged manifest-list index — so a tool that bulk-deletes
      # "untagged" versions can't tell a genuinely orphaned build apart from a live image's arch
      # variants. actions/delete-package-versions' delete-only-untagged-versions has an open,
      # unresolved bug doing exactly that (actions/delete-package-versions#162: deleted non-x86
      # manifests out from under a still-tagged multi-arch image). Since "staging" is a single
      # reused tag name (not unique per commit), it no longer grows the visible tag list either
      # way — if orphaned untagged versions need pruning later, do it by hand via the package's
      # "Manage versions" page, checking each one isn't still referenced by a live manifest list.
